
<h2 class="sr-only">NS Engineering eLibrary — Standard Codes category landing page with search and category grid</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.page{background:var(--color-background-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;}
.topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;}
.topbar-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--color-text-primary);}
.topbar-logo .logo-box{width:28px;height:28px;background:#534AB7;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.topbar-nav{display:flex;align-items:center;gap:4px;}
.nav-item{font-size:13px;color:var(--color-text-secondary);padding:5px 10px;border-radius:var(--border-radius-md);cursor:pointer;border:none;background:transparent;}
.nav-item:hover{background:var(--color-background-secondary);}
.nav-item.active{background:#EEEDFE;color:#3C3489;font-weight:500;}
.hero{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:28px 24px 24px;}
.hero-title{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:18px;}
.search-row{display:flex;align-items:center;gap:10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:0 12px;max-width:480px;}
.search-row i{font-size:16px;color:var(--color-text-tertiary);}
.search-row input{border:none;background:transparent;font-size:13.5px;color:var(--color-text-primary);padding:9px 0;outline:none;width:100%;}
.stats-row{display:flex;gap:20px;margin-top:18px;}
.stat{text-align:center;}
.stat-n{font-size:22px;font-weight:500;color:#534AB7;}
.stat-l{font-size:11px;color:var(--color-text-tertiary);margin-top:1px;}
.content{padding:20px 24px;}
.section-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.05em;margin-bottom:12px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.cat-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden;}
.cat-card:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary);}
.cat-card:hover .arrow{opacity:1;}
.icon-wrap{width:38px;height:38px;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.cat-name{font-size:13.5px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;}
.cat-count{font-size:12px;color:var(--color-text-tertiary);}
.arrow{position:absolute;top:12px;right:12px;font-size:14px;color:var(--color-text-tertiary);opacity:0;transition:opacity .15s;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-tertiary);margin-bottom:16px;}
.breadcrumb span{color:var(--color-text-primary);}
.detail-view{display:none;padding:20px 24px;}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{background:transparent;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 12px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;}
.back-btn:hover{background:var(--color-background-secondary);}
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.test-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px 14px;}
.test-id{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;margin-bottom:7px;}
.test-name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px;}
.std-wrap{display:flex;flex-wrap:wrap;gap:3px;}
.std-tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--color-background-secondary);color:var(--color-text-secondary);}
</style>

function buildCats(filter){
  const grid=document.getElementById('cat-grid');
  grid.innerHTML='';
  CATS.forEach(c=>{
    if(filter){
      const q=filter.toLowerCase();
      const match=c.name.toLowerCase().includes(q)||c.items.some(i=>i.test.toLowerCase().includes(q)||i.id.toLowerCase().includes(q)||i.stds.some(s=>s.toLowerCase().includes(q)));
      if(!match)return;
    }
    const card=document.createElement('div');
    card.className='cat-card';
    card.innerHTML=`
      <div class="icon-wrap" style="background:${c.bg};">
        <i class="ti ${c.icon}" style="font-size:18px;color:${c.ic};" aria-hidden="true"></i>
      </div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-count">${c.items.length} test${c.items.length!==1?'s':''}</div>
      <i class="ti ti-arrow-right arrow" aria-hidden="true"></i>`;
    card.addEventListener('click',()=>showDetail(c.key));
    grid.appendChild(card);
  });
  if(!grid.children.length){
    grid.innerHTML='<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--color-text-tertiary);font-size:13px;"><i class="ti ti-file-off" style="font-size:28px;display:block;margin-bottom:8px;" aria-hidden="true"></i>No categories match your search</div>';
  }
}

function showDetail(key){
  const c=CATS.find(x=>x.key===key);
  if(!c)return;
  document.getElementById('cat-view').style.display='none';
  const dv=document.getElementById('detail-view');
  dv.style.display='block';
  document.getElementById('breadcrumb-name').textContent=c.name;
  document.getElementById('detail-title').textContent=c.name;
  document.getElementById('detail-sub').textContent=c.items.length+' test protocols';
  const iw=document.getElementById('detail-icon-wrap');
  iw.style.background=c.bg;
  iw.innerHTML=`<i class="ti ${c.icon}" style="font-size:16px;color:${c.ic};" aria-hidden="true"></i>`;
  const tg=document.getElementById('test-grid');
  tg.innerHTML=c.items.map(i=>`
    <div class="test-card">
      <span class="test-id" style="background:${c.idbg};color:${c.idc};">${i.id}</span>
      <div class="test-name">${i.test}</div>
      <div class="std-wrap">${i.stds.map(s=>`<span class="std-tag">${s}</span>`).join('')}</div>
    </div>`).join('');
}

function showCats(){
  document.getElementById('detail-view').style.display='none';
  document.getElementById('cat-view').style.display='block';
  document.getElementById('hero-search').value='';
  buildCats('');
}

function filterAll(q){
  if(document.getElementById('detail-view').style.display==='block'){
    showCats();
  }
  buildCats(q);
}

buildCats('');
</script>
