name: Deploy to Cloudflare Pages (Dev)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: false

env:
  CONTENT_SOURCE_MODE: sheets

  # ==========================================================================
  # Public Runtime Variables (Available to Next.js Build)
  # ==========================================================================
  #
  # R2 URL and Turnstile key are intentionally set to placeholders here.
  # The actual per-environment values are substituted at deploy time by each
  # deploy job (deploy-dev / deploy-stage / deploy-prod), which runs inside
  # its own GitHub environment and therefore has access to the correct secret.
  # This lets us build once and promote the same artifact through all envs
  # while still having each env load assets from its own R2 bucket and use
  # its own Turnstile site key.
  # ==========================================================================

  NEXT_PUBLIC_R2_BASE_URL: "https://NSENGINEERING_R2_URL"
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "NSENGINEERING_TURNSTILE_KEY"
  NEXT_PUBLIC_EMAIL_WORKER_URL: "NSENGINEERING_EMAIL_WORKER_URL"
  NEXT_PUBLIC_API_URL: "NSENGINEERING_API_URL"

jobs:
  sync-assets:
    name: Sync Google Drive → R2
    runs-on: ubuntu-latest

    environment: dev

    env:
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Google Drive remote
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_credentials = {"type":"service_account","project_id":"${{ secrets.GDRIVE_PROJECT_ID }}","private_key_id":"${{ secrets.GDRIVE_PRIVATE_KEY_ID }}","private_key":"${{ secrets.GDRIVE_PRIVATE_KEY }}","client_email":"${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}","client_id":"${{ secrets.GDRIVE_CLIENT_ID }}","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}"}
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Configure Cloudflare R2 remote
        run: |
          set -euo pipefail
          cat >> ~/.config/rclone/rclone.conf <<EOF

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = public-read
          EOF
        
      - name: Sync media files to R2
        run: |
          set -euo pipefail
          echo "🚀 Syncing media files from Google Drive to R2..."

          rclone sync gdrive: r2:${R2_BUCKET_NAME} \
            --filter "- *.csv" \
            --filter "+ *.jpg" \
            --filter "+ *.jpeg" \
            --filter "+ *.png" \
            --filter "+ *.webp" \
            --filter "+ *.pdf" \
            --filter "- *" \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s

          echo "✅ Asset sync completed successfully"

      - name: Verify uploaded R2 files
        run: |
          echo "📦 Listing R2 bucket files..."
          rclone ls r2:${R2_BUCKET_NAME} | head -50

  build:
    name: Build Next.js Site (Dev)
    runs-on: ubuntu-latest

    environment: dev

    needs: sync-assets

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Placeholder — substituted with the correct per-env URL at deploy time
      NEXT_PUBLIC_R2_BASE_URL: "https://NSENGINEERING_R2_URL"

      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      # Placeholder — substituted with the correct per-env key at deploy time
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "NSENGINEERING_TURNSTILE_KEY"
      NEXT_PUBLIC_EMAIL_WORKER_URL: "NSENGINEERING_EMAIL_WORKER_URL"
      NEXT_PUBLIC_API_URL: "NSENGINEERING_API_URL"
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Build Next.js app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
        run: npm run build:cloud

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./out

  commit-csv:
    name: Commit CSV Updates
    runs-on: ubuntu-latest

    environment: dev

    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Fetch and export content to CSV
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
        run: npm run build:content:cloud

      - name: Commit CSV updates to repository
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add content/**/*.csv
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Content sync from Google Sheets [skip ci]" && git push)
          echo "✅ CSV version control updated"

  deploy-dev:
    name: Deploy to Cloudflare Pages (Dev via Wrangler)
    runs-on: ubuntu-latest

    environment: dev

    needs:
      - build
      - sync-assets

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Inject dev R2 URL, Turnstile key, Email Worker URL and API URL
        env:
          R2_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
          TURNSTILE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          : "${R2_URL:?NEXT_PUBLIC_R2_BASE_URL is not set in the dev GitHub environment}"
          : "${TURNSTILE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set in the dev GitHub environment}"
          : "${EMAIL_WORKER_URL:?NEXT_PUBLIC_EMAIL_WORKER_URL is not set in the dev GitHub environment}"
          : "${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is not set in the dev GitHub environment}"
          echo "Substituting R2 URL, Turnstile key, Email Worker URL and API URL for dev environment..."
          find ./out -type f \( -name "*.html" -o -name "*.js" -o -name "_redirects" \) \
            -exec sed -i "s|https://NSENGINEERING_R2_URL|${R2_URL}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_TURNSTILE_KEY|${TURNSTILE_KEY}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_EMAIL_WORKER_URL|${EMAIL_WORKER_URL}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_API_URL|${NEXT_PUBLIC_API_URL}|g" {} \;
          echo "✅ Dev environment values injected"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./out \
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} \
            --branch=dev

      - name: Deployment complete
        run: echo "🚀 Dev deployment successful via Wrangler"

  sync-assets-stage:
    name: Promote DEV R2 Assets → STAGING R2
    runs-on: ubuntu-latest
    environment: staging
    needs:
      - deploy-dev
    env:
      # DEV R2 (exported with DEV_ prefix to match script variables)
      DEV_R2_BUCKET_NAME: ${{ secrets.DEV_R2_BUCKET_NAME }}
      DEV_R2_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
      DEV_R2_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
      DEV_R2_ACCOUNT_ID: ${{ secrets.DEV_R2_ACCOUNT_ID }}
      # STAGE R2
      STAGE_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      STAGE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      STAGE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STAGE_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure DEV and STAGING R2 remotes
        run: |
          set -euo pipefail
          # Fail fast with clear message if required secrets are missing
          : "${DEV_R2_BUCKET_NAME:?Missing DEV_R2_BUCKET_NAME}"
          : "${DEV_R2_ACCESS_KEY_ID:?Missing DEV_R2_ACCESS_KEY_ID}"
          : "${DEV_R2_SECRET_ACCESS_KEY:?Missing DEV_R2_SECRET_ACCESS_KEY}"
          : "${DEV_R2_ACCOUNT_ID:?Missing DEV_R2_ACCOUNT_ID}"
          : "${STAGE_R2_BUCKET_NAME:?Missing STAGE_R2_BUCKET_NAME}"
          : "${STAGE_R2_ACCESS_KEY_ID:?Missing STAGE_R2_ACCESS_KEY_ID}"
          : "${STAGE_R2_SECRET_ACCESS_KEY:?Missing STAGE_R2_SECRET_ACCESS_KEY}"
          : "${STAGE_R2_ACCOUNT_ID:?Missing STAGE_R2_ACCOUNT_ID}"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF

          [r2-dev]
          type = s3
          provider = Cloudflare
          access_key_id = $DEV_R2_ACCESS_KEY_ID
          secret_access_key = $DEV_R2_SECRET_ACCESS_KEY
          endpoint = https://$DEV_R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = public-read

          [r2-stage]
          type = s3
          provider = Cloudflare
          access_key_id = $STAGE_R2_ACCESS_KEY_ID
          secret_access_key = $STAGE_R2_SECRET_ACCESS_KEY
          endpoint = https://$STAGE_R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Promote DEV assets to STAGING R2
        run: |
          set -euo pipefail
          echo "🚀 Promoting DEV assets to STAGING R2..."
          rclone sync r2-dev:${DEV_R2_BUCKET_NAME} \
            r2-stage:${STAGE_R2_BUCKET_NAME} \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s
          echo "✅ Asset promotion completed"

      - name: Verify STAGING R2 files
        run: |
          echo "📦 Listing STAGING R2 bucket files..."
          rclone ls r2-stage:${STAGE_R2_BUCKET_NAME} | head -50

  deploy-stage:
    name: Deploy to Cloudflare Pages (STAGE via Wrangler)
    needs:
      - deploy-dev
      - sync-assets-stage
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Inject stage R2 URL, Turnstile key, and Email Worker URL
        env:
          R2_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
          TURNSTILE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -euo pipefail
          : "${R2_URL:?NEXT_PUBLIC_R2_BASE_URL is not set in the staging GitHub environment}"
          : "${TURNSTILE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set in the staging GitHub environment - add it to the staging environment secrets}"
          : "${EMAIL_WORKER_URL:?NEXT_PUBLIC_EMAIL_WORKER_URL is not set in the staging GitHub environment}"
          : "${API_URL:?API_URL is not set in the staging GitHub environment}"I
          echo "Substituting R2 URL, Turnstile key, and Email Worker URL for staging environment..."
          find ./out -type f \( -name "*.html" -o -name "*.js" -o -name "_redirects" \) \
            -exec sed -i "s|https://NSENGINEERING_R2_URL|${R2_URL}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_TURNSTILE_KEY|${TURNSTILE_KEY}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_EMAIL_WORKER_URL|${EMAIL_WORKER_URL}|g" {} \;
          echo "✅ Staging environment values injected"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages (Stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./out \
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} \
            --branch=stage

      - name: Deployment complete
        run: echo "🚀 stage deployment successful via Wrangler"

# =============================================================================
# PRODUCTION PIPELINE
# =============================================================================

  sync-assets-prod:
    name: Promote STAGE R2 → PROD R2
    runs-on: ubuntu-latest

    environment: production

    needs:
      - deploy-stage

    env:
      # STAGE R2
      STAGE_R2_BUCKET_NAME: ${{ secrets.STAGE_R2_BUCKET_NAME }}
      STAGE_R2_ACCESS_KEY_ID: ${{ secrets.STAGE_R2_ACCESS_KEY_ID }}
      STAGE_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGE_R2_SECRET_ACCESS_KEY }}
      STAGE_R2_ACCOUNT_ID: ${{ secrets.STAGE_R2_ACCOUNT_ID }}

      # PROD R2
      PROD_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      PROD_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      PROD_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PROD_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure STAGE and PROD R2 remotes
        run: |
          set -euo pipefail
          # Fail fast with clear message if required secrets are missing
          : "${STAGE_R2_BUCKET_NAME:?Missing STAGE_R2_BUCKET_NAME}"
          : "${STAGE_R2_ACCESS_KEY_ID:?Missing STAGE_R2_ACCESS_KEY_ID}"
          : "${STAGE_R2_SECRET_ACCESS_KEY:?Missing STAGE_R2_SECRET_ACCESS_KEY}"
          : "${STAGE_R2_ACCOUNT_ID:?Missing STAGE_R2_ACCOUNT_ID}"
          : "${PROD_R2_BUCKET_NAME:?Missing PROD_R2_BUCKET_NAME}"
          : "${PROD_R2_ACCESS_KEY_ID:?Missing PROD_R2_ACCESS_KEY_ID}"
          : "${PROD_R2_SECRET_ACCESS_KEY:?Missing PROD_R2_SECRET_ACCESS_KEY}"
          : "${PROD_R2_ACCOUNT_ID:?Missing PROD_R2_ACCOUNT_ID}"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF

          [r2-stage]
          type = s3
          provider = Cloudflare
          access_key_id = $STAGE_R2_ACCESS_KEY_ID
          secret_access_key = $STAGE_R2_SECRET_ACCESS_KEY
          endpoint = https://$STAGE_R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = public-read

          [r2-prod]
          type = s3
          provider = Cloudflare
          access_key_id = $PROD_R2_ACCESS_KEY_ID
          secret_access_key = $PROD_R2_SECRET_ACCESS_KEY
          endpoint = https://$PROD_R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = public-read

          EOF

      - name: Promote STAGE assets to PROD
        run: |
          set -euo pipefail

          echo "🚀 Promoting STAGE assets to PROD..."

          rclone sync \
            r2-stage:${STAGE_R2_BUCKET_NAME} \
            r2-prod:${PROD_R2_BUCKET_NAME} \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s

          echo "✅ Production asset promotion completed"

      - name: Verify PROD R2 files
        run: |
          echo "📦 Listing PROD R2 bucket files..."
          rclone ls r2-prod:${PROD_R2_BUCKET_NAME} | head -50

  deploy-prod:
    name: Deploy PRODUCTION
    runs-on: ubuntu-latest

    environment: production

    needs:
      - deploy-stage
      - sync-assets-prod

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Inject prod R2 URL, Turnstile key, and Email Worker URL
        env:
          R2_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
          TURNSTILE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}
        run: |
          set -euo pipefail
          : "${R2_URL:?NEXT_PUBLIC_R2_BASE_URL is not set in the production GitHub environment}"
          : "${TURNSTILE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set in the production GitHub environment}"
          : "${EMAIL_WORKER_URL:?NEXT_PUBLIC_EMAIL_WORKER_URL is not set in the production GitHub environment}"
          echo "Substituting R2 URL, Turnstile key, and Email Worker URL for production environment..."
          find ./out -type f \( -name "*.html" -o -name "*.js" -o -name "_redirects" \) \
            -exec sed -i "s|https://NSENGINEERING_R2_URL|${R2_URL}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_TURNSTILE_KEY|${TURNSTILE_KEY}|g" {} \;
          find ./out -type f \( -name "*.html" -o -name "*.js" \) \
            -exec sed -i "s|NSENGINEERING_EMAIL_WORKER_URL|${EMAIL_WORKER_URL}|g" {} \;
          echo "✅ Production environment values injected"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages (PRODUCTION)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./out \
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} \
            --branch=main

      - name: Deployment complete
        run: echo "🚀 Production deployment successful"