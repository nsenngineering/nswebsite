name: Deploy to Cloudflare Pages (Dev)

on:
  push:
    branches: [feature/ritika/Goal3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: false

env:
  CONTENT_SOURCE_MODE: sheets
  NEXT_PUBLIC_R2_BASE_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}

jobs:
  sync-assets:
    name: Sync Google Drive → R2
    runs-on: ubuntu-latest

    # Enables ENVIRONMENT secrets
    environment: dev

    env:
      R2_DEV_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_DEV_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_DEV_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_DEV_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Google Drive remote
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_credentials = {"type":"service_account","project_id":"${{ secrets.GDRIVE_PROJECT_ID }}","private_key_id":"${{ secrets.GDRIVE_PRIVATE_KEY_ID }}","private_key":"${{ secrets.GDRIVE_PRIVATE_KEY }}","client_email":"${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}","client_id":"${{ secrets.GDRIVE_CLIENT_ID }}","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}"}
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Configure Cloudflare R2 remote
        run: |
          set -euo pipefail
          cat >> ~/.config/rclone/rclone.conf <<EOF

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_DEV_ACCESS_KEY_ID}
          secret_access_key = ${R2_DEV_SECRET_ACCESS_KEY}
          endpoint = https://${R2_DEV_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF
        
      - name: Sync media files to R2
        run: |
          set -euo pipefail
          echo "🚀 Syncing media files from Google Drive to R2..."

          rclone sync gdrive: r2:${R2_DEV_BUCKET_NAME} \
            --filter "- *.csv" \
            --filter "+ *.jpg" \
            --filter "+ *.jpeg" \
            --filter "+ *.png" \
            --filter "+ *.webp" \
            --filter "+ *.pdf" \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s
          echo "✅ Asset sync completed successfully"
          
  build:
    name: Build Next.js Site (Dev)
    runs-on: ubuntu-latest
    
    # Enables ENVIRONMENT secrets
    environment: dev

    env:
      R2_DEV_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Google credentials file
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Build Next.js app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./out

  deploy:
    name: Deploy to Cloudflare Pages (Dev via Wrangler)
    runs-on: ubuntu-latest

    environment: dev

    needs:
      - build
      - sync-assets

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          wrangler pages deploy ./out \
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

      - name: Deployment complete
        run: echo "🚀 Dev deployment successful via Wrangler"