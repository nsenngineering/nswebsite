name: Deploy to Cloudflare Pages (Dev)

on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-dev"
  cancel-in-progress: false

jobs:

  build:
    name: Build Next.js Site (Dev)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create Google credentials file
        shell: powershell
        run: |
          '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' | Out-File -FilePath google-credentials.json -Encoding utf8

      - name: Build Next.js app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          NEXT_PUBLIC_R2_BASE_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}

        run: npm run build:cloud

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./out


  deploy:
    name: Deploy to Cloudflare Pages (Dev)
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.nsengineering-dev }}
          directory: ./out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment complete
        run: echo "🚀 Dev deployment successful"