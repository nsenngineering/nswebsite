name: Deploy to Cloudflare Pages (Dev)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-dev"
  cancel-in-progress: false


jobs:

  build:
    name: Build Next.js Site (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Build Next.js app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          NEXT_PUBLIC_R2_BASE_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}

        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./out


  deploy:
    name: Deploy to Cloudflare Pages (Dev via Wrangler)
    runs-on: ubuntu-latest
    environment: dev
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./out

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages (Dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          wrangler pages deploy ./out \
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

      - name: Deployment complete
        run: echo "🚀 Dev deployment successful via Wrangler"