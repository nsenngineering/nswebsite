# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NS Engineering Website - Production Deployment Pipeline
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# This workflow orchestrates the complete deployment process:
#   1. Sync media assets from Google Drive → Cloudflare R2
#   2. Fetch structured content from Google Sheets → JSON
#   3. Build static Next.js site with R2 CDN URLs
#   4. Deploy to GitHub Pages
#   5. Commit CSV exports for version control
#
# Triggers:
#   - Push to 'cloudflare' branch
#   - Manual dispatch via GitHub UI
#
# Architecture:
#   - GitHub Actions orchestrates everything
#   - Next.js builds consume pre-fetched data (no runtime API calls)
#   - Assets are served from R2 CDN
#   - Content is version-controlled via CSV exports
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy to Production

on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: write  # For committing CSV updates
  pages: write     # For deploying to GitHub Pages
  id-token: write  # For GitHub Pages deployment

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Content source mode for the build
  CONTENT_SOURCE_MODE: sheets

  # Public R2 base URL for asset loading
  NEXT_PUBLIC_R2_BASE_URL: ${{ secrets.NEXT_PUBLIC_R2_BASE_URL }}

  # R2 bucket name
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

  # Google Sheet ID for content
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  # Turnstile site key for spam protection
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # Email worker URL for form submissions
  NEXT_PUBLIC_EMAIL_WORKER_URL: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL }}

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 1: Sync Assets
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Purpose: Sync media files from Google Drive to Cloudflare R2 CDN
  # Why: Assets must be available before Next.js build references them
  # Note: Uses exact same configuration as manual-sync.yml (tested & working)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sync-assets:
    name: Sync Google Drive → R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Google Drive remote
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_credentials = {"type":"service_account","project_id":"${{ secrets.GDRIVE_PROJECT_ID }}","private_key_id":"${{ secrets.GDRIVE_PRIVATE_KEY_ID }}","private_key":"${{ secrets.GDRIVE_PRIVATE_KEY }}","client_email":"${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}","client_id":"${{ secrets.GDRIVE_CLIENT_ID }}","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}"}
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Configure Cloudflare R2 remote
        run: |
          set -euo pipefail
          cat >> ~/.config/rclone/rclone.conf <<EOF

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Sync media files to R2
        run: |
          set -euo pipefail
          echo "🚀 Syncing media files from Google Drive to R2..."

          rclone sync gdrive: r2:${{ secrets.R2_BUCKET_NAME }}/ \
            --filter "- *.csv" \
            --filter "+ *.jpg" \
            --filter "+ *.jpeg" \
            --filter "+ *.png" \
            --filter "+ *.webp" \
            --filter "+ *.pdf" \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s

          echo "✅ Asset sync completed successfully"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 2: Build Website
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Purpose: Fetch content from Google Sheets, build Next.js static site
  # Why: Deterministic builds require all data fetched at build time
  # Depends on: sync-assets (assets must be in R2 before build)
  # Outputs: Static HTML/CSS/JS in ./out directory
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  build:
    name: Build Next.js Site
    runs-on: ubuntu-latest
    needs: sync-assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Create Google credentials file
        run: |
          set -euo pipefail
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Build Next.js static site with content fetch
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_EMAIL_WORKER_URL_STAGE: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL_STAGE }}
          NEXT_PUBLIC_EMAIL_WORKER_URL_PROD: ${{ secrets.NEXT_PUBLIC_EMAIL_WORKER_URL_PROD }}
        run: |
          set -euo pipefail
          echo "🔨 Building Next.js site (includes content fetch from Sheets)..."
          npm run build:cloud
          echo "✅ Build completed successfully"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 3: Deploy to GitHub Pages
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Purpose: Deploy the static build to GitHub Pages
  # Why: Makes the site publicly accessible
  # Depends on: build (must have artifact to deploy)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployment URL
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment successful!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job 4: Commit CSV Exports
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Purpose: Version control content by committing CSV exports from Sheets
  # Why: Provides audit trail, enables git-based content rollback
  # Depends on: build (CSV files generated during content fetch)
  # Note: Uses [skip ci] to prevent infinite deployment loops
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  commit-csv:
    name: Commit CSV Updates
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Create Google credentials file
        run: |
          set -euo pipefail
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      - name: Fetch and export content to CSV
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./google-credentials.json
        run: |
          set -euo pipefail
          npm run build:content:cloud

      - name: Commit CSV updates to repository
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add content/**/*.csv

          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update content from Google Sheets [skip ci]" && git push)

          echo "✅ CSV version control updated"
