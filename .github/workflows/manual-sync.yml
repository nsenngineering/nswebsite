name: Manual R2 Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test without actual sync)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure Google Drive remote
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_credentials = {"type":"service_account","project_id":"${{ secrets.GDRIVE_PROJECT_ID }}","private_key_id":"${{ secrets.GDRIVE_PRIVATE_KEY_ID }}","private_key":"${{ secrets.GDRIVE_PRIVATE_KEY }}","client_email":"${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}","client_id":"${{ secrets.GDRIVE_CLIENT_ID }}","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}"}
          root_folder_id = ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          EOF

      - name: Configure Cloudflare R2 remote
        run: |
          cat >> ~/.config/rclone/rclone.conf <<EOF

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Sync media files from Google Drive to R2
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "🧪 DRY RUN MODE - No files will be modified"
          else
            echo "🚀 LIVE SYNC MODE - Files will be synced to R2"
          fi

          echo "Starting sync from Google Drive to R2..."
          rclone sync gdrive:content/ r2:${{ secrets.R2_BUCKET_NAME }}/ \
            --drive-root-folder-id=${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
            --filter "- *.csv" \
            --filter "+ *.jpg" \
            --filter "+ *.jpeg" \
            --filter "+ *.png" \
            --filter "+ *.webp" \
            --filter "+ *.pdf" \
            --progress \
            --checksum \
            --log-level INFO \
            --stats 30s \

            $DRY_RUN_FLAG

          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "✅ Dry run completed - Review the output above"
          else
            echo "✅ Sync completed successfully!"
          fi

      - name: Display sync summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Sync Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Source: Google Drive (content/)"
          echo "Destination: R2 (${{ secrets.R2_BUCKET_NAME }})"
          echo "Mode: ${{ inputs.dry_run == 'true' && 'DRY RUN' || 'LIVE SYNC' }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
